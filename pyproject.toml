[project]
name = "kindle-wallp"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pillow==12.3.0",
]

[project.scripts]
kwallp = "main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
include = ["main.py"]

[dependency-groups]
dev = [
    "ruff>=0.16.8",
]
